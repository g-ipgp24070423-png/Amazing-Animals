<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Amazing Animals: The Quiz Challenge!</title>
<style>
:root{--bg:#fff7e0;--card:#ffffff;--ink:#2b2a33;--brand:#ff8a00;--brand-ink:#ffffff;--ok:#2e9e4f;--bad:#d93a3a;--line:#ffd98a;--soft:#fff1c7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1d2b;--card:#2a2840;--ink:#f4f1ff;--line:#4a4670;--soft:#37345a}}
:root[data-theme="dark"]{--bg:#1f1d2b;--card:#2a2840;--ink:#f4f1ff;--line:#4a4670;--soft:#37345a}
*{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Comic Sans MS","Trebuchet MS",system-ui,sans-serif;font-size:20px;display:flex;justify-content:center;padding:16px}
.card{background:var(--card);border:4px solid var(--line);border-radius:24px;padding:24px;width:100%;max-width:640px;text-align:center}
h1{font-size:2rem;margin:.2em 0;color:var(--brand)}
.big{font-size:4rem;line-height:1.1;margin:.2em 0}
button{font:inherit;cursor:pointer;border:0;border-radius:16px;padding:14px 28px;background:var(--brand);color:var(--brand-ink);font-weight:bold;font-size:1.1rem}
button:focus-visible{outline:4px solid var(--ink);outline-offset:2px}
.top{display:flex;justify-content:space-between;font-weight:bold;margin-bottom:8px}
.bar{height:16px;background:var(--soft);border-radius:8px;overflow:hidden;margin-bottom:16px}
.bar div{height:100%;width:0;background:var(--ok);transition:width .3s}
.sec{display:inline-block;background:var(--soft);padding:4px 14px;border-radius:12px;font-size:.85rem;font-weight:bold}
.q{font-size:1.3rem;margin:14px 0;min-height:3.5em}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opts button{background:var(--soft);color:var(--ink);border:3px solid var(--line);text-align:left}
.opts button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.opts button.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.fb{min-height:3em;margin:14px 0;font-weight:bold}
.hide{display:none}
@media(max-width:480px){.opts{grid-template-columns:1fr}body{font-size:18px}}
</style>
</head>
<body>
<main class="card">
<section id="start">
<div class="big">🐘🦒🐯🐰🐆🐢</div>
<h1>Amazing Animals: The Quiz Challenge!</h1>
<p>Read each question. Choose the best answer.<br>There are 10 questions. Good luck!</p>
<button id="go">▶ START GAME</button>
</section>
<section id="play" class="hide">
<div class="top"><span id="num"></span><span>⭐ Score: <span id="score">0</span></span></div>
<div class="bar"><div id="fill"></div></div>
<span class="sec" id="sec"></span>
<p class="q" id="q"></p>
<div class="opts" id="opts"></div>
<p class="fb" id="fb" aria-live="polite"></p>
<button id="next" class="hide">NEXT QUESTION ➜</button>
</section>
<section id="end" class="hide">
<div class="big" id="emo"></div>
<h1 id="msg"></h1>
<p>Your score: <strong id="fin"></strong> out of 10</p>
<button id="again">🔁 PLAY AGAIN</button>
</section>
</main>
<script>
const A="Section A: Guess the animal",B="Section B: Comparative adjectives",C="Section C: Complete the sentence";
const Q=[
[A,"🦒","I am a very tall animal. I have a long neck and long legs. I eat leaves from trees. What animal am I?",["Giraffe","Elephant","Rabbit","Tiger"],0,"I am a giraffe: tall, with a long neck!"],
[A,"🐯","I have orange fur with black stripes. I am a big cat and I am dangerous. What animal am I?",["Turtle","Tiger","Rabbit","Giraffe"],0,"I am a tiger: a big cat with stripes!"],
[A,"🐢","I am slow. I have a hard shell on my back. I can live for a very long time. What animal am I?",["Cheetah","Elephant","Turtle","Tiger"],0,"I am a turtle: slow, with a hard shell!"],
[B,"🐆","A cheetah is ______ than a turtle.",["faster","fast","fastest","more fast"],0,"Short adjective: fast + er = faster."],
[B,"🐰","A rabbit is ______ than an elephant.",["smaller","small","smallest","more small"],0,"Short adjective: small + er = smaller."],
[B,"🦒","A giraffe is ______ than a rabbit.",["taller","tall","tallest","more tall"],0,"Short adjective: tall + er = taller."],
[B,"🐯","A tiger is ______ than a turtle.",["more dangerous","dangerouser","dangerous","most dangerous"],0,"Long adjective: use more + dangerous."],
[C,"🐯","A tiger is ______ than a rabbit.",["stronger","strong","strongest","more strong"],0,"Short adjective: strong + er = stronger."],
[C,"🐘","An elephant is ______ than a giraffe.",["heavier","heavy","heaviest","more heavy"],0,"Heavy ends in y: change y to i, then add er = heavier."],
[C,"🦋","A butterfly is ______ than a spider.",["prettier","pretty","prettiest","more pretty"],0,"Pretty ends in y: change y to i, then add er = prettier."]
];
const $=id=>document.getElementById(id);
let i=0,score=0,done=false,order=[];
function show(id){["start","play","end"].forEach(s=>$(s).classList.toggle("hide",s!==id))}
function shuffle(a){for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function load(){
  const [sec,emo,text,opts,ans]=Q[i];done=false;
  $("num").textContent="Question "+(i+1)+" of 10";
  $("fill").style.width=(i/10*100)+"%";
  $("sec").textContent=emo+" "+sec;
  $("q").textContent=text;
  $("fb").textContent="";$("fb").style.color="";
  $("next").classList.add("hide");
  $("next").textContent=i==9?"SEE MY RESULTS 🏆":"NEXT QUESTION ➜";
  const box=$("opts");box.innerHTML="";
  order=shuffle(opts.map((t,k)=>({t,k})));
  order.forEach(o=>{
    const b=document.createElement("button");
    b.textContent=o.t;b.dataset.k=o.k;
    b.onclick=()=>pick(b,o.k===ans);
    box.appendChild(b);
  });
}
function pick(btn,right){
  if(done)return;done=true;
  const q=Q[i];
  if(right){score++;$("score").textContent=score;btn.classList.add("ok");$("fb").textContent="✅ Correct! "+q[5];$("fb").style.color="var(--ok)"}
  else{btn.classList.add("bad");
    [...$("opts").children].forEach(b=>{if(+b.dataset.k===q[4])b.classList.add("ok")});
    $("fb").textContent="❌ Not quite. The answer is “"+q[3][q[4]]+"”. "+q[5];$("fb").style.color="var(--bad)"}
  $("fill").style.width=((i+1)/10*100)+"%";
  $("next").classList.remove("hide");
}
function finish(){
  show("end");$("fin").textContent=score;
  const [m,e]=score>=9?["Excellent!","🏆🎉"]:score>=6?["Great Try!","🌟👏"]:["Keep Practising!","💪🐢"];
  $("msg").textContent=m;$("emo").textContent=e;
}
$("go").onclick=()=>{i=0;score=0;$("score").textContent=0;show("play");load()};
$("next").onclick=()=>{i++;i<10?load():finish()};
$("again").onclick=()=>{i=0;score=0;$("score").textContent=0;show("play");load()};
</script>
</body>
</html>
